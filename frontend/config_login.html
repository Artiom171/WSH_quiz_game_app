<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Панель ведущего</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(180deg, #e2e6d4 0%, #eeeee2 100%);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.10);
      padding: 44px 40px 40px;
      width: 100%;
      max-width: 380px;
    }
    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; color: #0f172a; }
    .sub { margin: 0 0 28px; font-size: 13px; color: #64748b; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 5px; }
    input {
      display: block; width: 100%; padding: 10px 14px;
      border: 1.5px solid #d1d5db; border-radius: 10px;
      font-size: 15px; font-family: inherit; color: #0f172a;
      background: #f9fafb; outline: none; transition: border-color 0.15s; margin-bottom: 16px;
    }
    input:focus { border-color: #a3b563; background: #fff; }
    .btn {
      display: block; width: 100%; padding: 12px;
      background: #cce840; color: #0f172a; font-size: 15px; font-weight: 700;
      border: none; border-radius: 10px; cursor: pointer; margin-top: 6px;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn:hover { background: #b8d400; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .error {
      display: none; margin-top: 14px; padding: 10px 14px;
      background: #fee2e2; color: #b91c1c; border-radius: 8px; font-size: 13px; font-weight: 500;
    }
    /* Password reveal overlay */
    #reveal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.55); z-index: 100;
      align-items: center; justify-content: center;
    }
    #reveal-overlay.open { display: flex; }
    #reveal-box {
      background: #fff; border-radius: 16px; padding: 36px 32px;
      max-width: 320px; width: 90%; text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    }
    #reveal-box h2 { margin: 0 0 8px; font-size: 18px; color: #0f172a; }
    #reveal-box .label { font-size: 12px; color: #64748b; margin: 0 0 4px; }
    #reveal-box .value {
      font-size: 20px; font-weight: 700; letter-spacing: 0.04em;
      background: #f1f5e8; border-radius: 8px; padding: 10px 16px;
      margin: 0 0 20px; word-break: break-all; color: #0f172a;
    }
    #reveal-box button {
      background: #cce840; border: none; border-radius: 10px;
      padding: 10px 28px; font-size: 14px; font-weight: 700; cursor: pointer;
    }
    #reveal-box button:hover { background: #b8d400; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Панель ведущего</h1>
    <p class="sub">Введите учётные данные для доступа</p>
    <label for="username">Логин</label>
    <input id="username" type="text" autocomplete="username" placeholder="Логин" />
    <label for="password">Пароль</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Пароль" />
    <button class="btn" id="submit-btn" onclick="doLogin()">Войти</button>
    <div class="error" id="error-msg">Неверный логин или пароль</div>
  </div>

  <div id="reveal-overlay" onclick="closeReveal()">
    <div id="reveal-box" onclick="event.stopPropagation()">
      <h2>Ваши данные</h2>
      <div class="label">Логин</div>
      <div class="value" id="reveal-login"></div>
      <div class="label">Пароль</div>
      <div class="value" id="reveal-password"></div>
      <button onclick="closeReveal()">Закрыть</button>
    </div>
  </div>

  <script>
    // --- Login ---
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const btn = document.getElementById('submit-btn');
      const err = document.getElementById('error-msg');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) return;
      btn.disabled = true;
      err.style.display = 'none';
      try {
        const res = await fetch('/api/config-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          credentials: 'same-origin',
        });
        if (res.ok) {
          window.location.href = '/config.html';
        } else {
          err.style.display = 'block';
          btn.disabled = false;
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      } catch {
        err.style.display = 'block';
        btn.disabled = false;
      }
    }

    // --- Secret phrase reveal ---
    const SECRET = 'ihaveforgotthepassword';
    let _buf = '';

    document.addEventListener('keypress', e => {
      _buf = (_buf + e.key).slice(-SECRET.length);
      if (_buf === SECRET) {
        _buf = '';
        showReveal();
      }
    });

    async function showReveal() {
      const res = await fetch('/api/config-recover', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phrase: SECRET }),
        credentials: 'same-origin',
      }).catch(() => null);
      if (!res || !res.ok) return;
      const data = await res.json();
      document.getElementById('reveal-login').textContent = data.username;
      document.getElementById('reveal-password').textContent = data.password;
      document.getElementById('reveal-overlay').classList.add('open');
    }

    function closeReveal() {
      document.getElementById('reveal-overlay').classList.remove('open');
      document.getElementById('reveal-password').textContent = '';
    }
  </script>
</body>
</html>
