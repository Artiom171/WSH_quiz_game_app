<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Финальный результат — Демо</title>
  <style>
    html, body {
      height: 100vh;
      overflow: hidden;
    }

    body {
      margin: 0;
      padding: 20px 20px 0;
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(180deg, #e2e6d4 0%, #d8dcc8 100%);
      color: #0f172a;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(148, 163, 184, 0.16);
      max-height: calc(100vh - 108px);
      overflow-y: auto;
    }

    h2 {
      font-size: 32px;
      margin: 0 0 16px;
      text-align: center;
      color: #111827;
    }

    p.subtitle {
      text-align: center;
      margin: 0 0 24px;
      color: #475569;
      font-size: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 18px;
      background: #ffffff;
    }

    thead { background: linear-gradient(90deg, #a8d800 0%, #aace28 100%); }

    th, td { padding: 16px 18px; text-align: left; }

    th {
      color: #ffffff;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    tbody tr { border-bottom: 1px solid #e2e8f0; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:nth-child(even) { background: #f8fafc; }
    tbody tr:hover { background: #e4ecd0; }

    td.rank { width: 72px; font-weight: 700; color: #3a4e15; }
    td.score { font-weight: 600; color: #0f172a; }

    tr.rank-first td { font-size: 17px; }
    tr.rank-first td.rank { font-size: 20px; color: #80b000; }

    /* ===== ROW REVEAL ===== */
    @keyframes rowReveal {
      from { opacity: 0; transform: translateX(-32px); background: rgba(168,216,0,0.18); }
      60%  { background: rgba(168,216,0,0.08); }
      to   { opacity: 1; transform: translateX(0); background: transparent; }
    }
    @keyframes rowRevealFirst {
      0%   { opacity: 0; transform: scale(0.9) translateX(-24px); background: rgba(168,216,0,0.35); }
      55%  { transform: scale(1.03) translateX(0); background: rgba(168,216,0,0.15); }
      100% { opacity: 1; transform: scale(1); background: transparent; }
    }
    .reveal-anim       { animation: rowReveal 0.48s cubic-bezier(0.22,1,0.36,1) forwards; }
    .reveal-anim-first { animation: rowRevealFirst 0.65s cubic-bezier(0.22,1,0.36,1) forwards; }

    /* ===== FIREWORKS CANVAS ===== */
    #fireworks-canvas {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      pointer-events: none;
    }

    /* ===== WINNER OVERLAY ===== */
    #winner-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 300;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .winner-card {
      text-align: center;
      padding: 44px 64px;
      background: rgba(14,18,4,0.88);
      border-radius: 32px;
      border: 2px solid rgba(168,216,0,0.45);
      backdrop-filter: blur(16px);
      box-shadow: 0 0 80px rgba(168,216,0,0.2), 0 32px 80px rgba(0,0,0,0.5);
      animation: winnerAppear 0.65s cubic-bezier(0.22,1,0.36,1);
    }

    @keyframes winnerAppear {
      from { opacity: 0; transform: scale(0.68) translateY(30px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .winner-trophy {
      font-size: 88px;
      line-height: 1;
      margin-bottom: 10px;
      animation: trophyBounce 1.2s ease-in-out infinite;
    }

    @keyframes trophyBounce {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50%       { transform: translateY(-12px) rotate(4deg); }
    }

    .winner-label {
      font-size: 16px;
      font-weight: 800;
      color: #a8d800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .winner-name {
      font-size: clamp(36px, 6vw, 76px);
      font-weight: 900;
      color: #ffffff;
      line-height: 1.1;
      text-shadow: 0 0 48px rgba(168,216,0,0.7), 0 0 96px rgba(168,216,0,0.3);
      animation: nameGlow 2s ease-in-out infinite alternate;
    }

    @keyframes nameGlow {
      from { text-shadow: 0 0 48px rgba(168,216,0,0.5), 0 0 96px rgba(168,216,0,0.2); }
      to   { text-shadow: 0 0 64px rgba(168,216,0,0.9), 0 0 128px rgba(168,216,0,0.5); }
    }

    .winner-hint {
      margin-top: 28px;
      font-size: 13px;
      color: #475569;
      letter-spacing: 0.04em;
    }

    /* ===== HINT BAR ===== */
    #hint-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(20,26,4,0.92);
      color: #cce840;
      text-align: center;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
      backdrop-filter: blur(10px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    #hint-counter { color: #ffffff; font-weight: 400; }
    #hint-done    { color: #a8d800; display: none; }

    /* ===== FULLSCREEN BUTTON ===== */
    #btn-fullscreen {
      position: fixed;
      top: 16px; right: 16px;
      background: rgba(26,32,0,0.82);
      color: #cce840;
      border: 1px solid rgba(204,232,64,0.3);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 18px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      z-index: 100;
      line-height: 1;
    }
    #btn-fullscreen:hover { background: rgba(26,32,0,0.95); }

    /* ===== FADE TO BLACK ===== */
    #fade-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      z-index: 190;
      transition: opacity 1s ease;
    }

    @media (max-width: 720px) {
      .container { padding: 20px; }
      table { display: block; overflow-x: auto; }
      th, td { padding: 14px 12px; }
      .winner-card { padding: 32px 28px; }
    }
  </style>
</head>
<body>

  <button id="btn-fullscreen" onclick="toggleFullscreen()" title="Полный экран">⛶</button>

  <div class="container">
    <h2>Финальный результат</h2>
    <p class="subtitle" id="subtitle">Загрузка...</p>
    <table>
      <thead>
        <tr><th>#</th><th>Игрок</th><th>Баллы</th></tr>
      </thead>
      <tbody id="resultsTable"></tbody>
    </table>
  </div>

  <div id="hint-bar">
    <span id="hint-text">Пробел — открыть следующего игрока</span>
    <span id="hint-counter"></span>
    <span id="hint-done">Все результаты открыты · R — начать заново</span>
  </div>

  <!-- Fade-to-black layer -->
  <div id="fade-overlay"></div>

  <!-- Fireworks layer (behind overlay) -->
  <canvas id="fireworks-canvas"></canvas>

  <!-- Winner overlay -->
  <div id="winner-overlay" style="display:none" onclick="stopCelebration()">
    <div class="winner-card">
      <div class="winner-trophy">🏆</div>
      <div class="winner-label">Победитель</div>
      <div class="winner-name" id="winner-name"></div>
      <div class="winner-hint">Нажмите Пробел или кликните чтобы закрыть</div>
    </div>
  </div>

<script>
  /* ============================================================
     DATA & REVEAL
  ============================================================ */
  function esc(str) {
    return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  let allData = [];
  let revealIndex = -1;

  async function loadResults() {
    try {
      const res = await fetch("/results");
      allData = await res.json();
    } catch (_) { allData = []; }

    document.getElementById("resultsTable").innerHTML = "";
    revealIndex = allData.length - 1;
    updateHint();

    const subtitle = document.getElementById("subtitle");
    if (allData.length === 0) {
      subtitle.textContent = "Пока нет зарегистрированных игроков.";
    } else {
      const n = allData.length;
      subtitle.textContent = `${n} игрок${n === 1 ? '' : n < 5 ? 'а' : 'ов'} · результаты скрыты`;
    }
  }

  function updateHint() {
    const total    = allData.length;
    const revealed = total - 1 - revealIndex;
    const hintText = document.getElementById("hint-text");
    const counter  = document.getElementById("hint-counter");
    const doneEl   = document.getElementById("hint-done");

    if (revealIndex < 0) {
      hintText.style.display  = "none";
      counter.style.display   = "none";
      doneEl.style.display    = "";
    } else {
      hintText.style.display  = "";
      counter.style.display   = "";
      doneEl.style.display    = "none";
      counter.textContent     = `${revealed} из ${total}`;
    }
  }

  function revealNext() {
    if (revealIndex < 0) return;

    const player  = allData[revealIndex];
    const rank    = revealIndex + 1;
    const isFirst = revealIndex === 0;

    const tbody = document.getElementById("resultsTable");
    const tr    = document.createElement("tr");
    if (isFirst) tr.classList.add("rank-first");
    tr.classList.add(isFirst ? "reveal-anim-first" : "reveal-anim");
    tr.innerHTML = `
      <td class="rank">${isFirst ? '🏆 1' : rank}</td>
      <td>${esc(player.name)}</td>
      <td class="score">${player.score ?? 0}</td>
    `;
    tbody.prepend(tr);
    revealIndex--;
    updateHint();

    if (isFirst) {
      document.getElementById("subtitle").textContent = "Итоговые результаты игры";
      document.getElementById('fade-overlay').style.opacity = '1';
      setTimeout(() => celebrate(player.name), 1000);
    }
  }

  function resetReveal() {
    stopCelebration();
    document.getElementById("resultsTable").innerHTML = "";
    revealIndex = allData.length - 1;
    updateHint();
    const n = allData.length;
    document.getElementById("subtitle").textContent =
      n > 0 ? `${n} игрок${n === 1 ? '' : n < 5 ? 'а' : 'ов'} · результаты скрыты`
             : "Пока нет зарегистрированных игроков.";
  }

  /* ============================================================
     FIREWORKS ENGINE
  ============================================================ */
  const FW_COLORS = [
    '#a8d800','#cce840','#d23769','#f472b6',
    '#fbbf24','#fde68a','#ffffff',
    '#34d399','#f87171','#60a5fa','#fb923c'
  ];

  let fwCanvas, fwCtx, fwRaf;
  let fwRunning  = false;
  let fwLaunchId = null;
  const fwParticles = [];
  const fwRockets   = [];

  class FWParticle {
    constructor(x, y, color) {
      this.x = x; this.y = y; this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 7 + 1.5;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.alpha = 1;
      this.decay = Math.random() * 0.016 + 0.008;
      this.gravity = 0.09;
      this.r = Math.random() * 2.8 + 0.6;
    }
    update() {
      this.vy += this.gravity;
      this.vx *= 0.984;
      this.x  += this.vx;
      this.y  += this.vy;
      this.alpha -= this.decay;
      this.r *= 0.996;
    }
    draw(ctx) {
      if (this.alpha <= 0) return;
      ctx.save();
      ctx.globalAlpha = Math.max(0, this.alpha);
      ctx.fillStyle   = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, Math.max(0.1, this.r), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  class FWRocket {
    constructor() {
      this.x      = fwCanvas.width * (0.1 + Math.random() * 0.8);
      this.y      = fwCanvas.height + 4;
      this.speed  = Math.random() * 5 + 13;
      this.vy     = -this.speed;
      this.target = fwCanvas.height * (0.08 + Math.random() * 0.45);
      this.color  = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
      this.trail  = [];
      this.dead   = false;
    }
    update() {
      this.vy += 0.28;
      this.y  += this.vy;
      this.trail.unshift({ x: this.x, y: this.y });
      if (this.trail.length > 10) this.trail.pop();
      if (this.y <= this.target || this.vy >= 0) {
        this._explode();
        this.dead = true;
      }
    }
    _explode() {
      const count = Math.floor(Math.random() * 40 + 65);
      for (let i = 0; i < count; i++) {
        fwParticles.push(new FWParticle(this.x, this.y, this.color));
      }
      // shimmer layer
      for (let i = 0; i < 22; i++) {
        const p = new FWParticle(this.x, this.y, Math.random() > 0.4 ? '#fbbf24' : '#ffffff');
        p.r     = Math.random() * 1.6 + 0.4;
        p.decay = Math.random() * 0.028 + 0.014;
        fwParticles.push(p);
      }
    }
    draw(ctx) {
      ctx.save();
      this.trail.forEach((p, i) => {
        ctx.globalAlpha = (1 - i / this.trail.length) * 0.55;
        ctx.fillStyle   = this.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }
  }

  function fwTick() {
    fwCtx.fillStyle = 'rgba(0,0,0,0.16)';
    fwCtx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);

    for (let i = fwRockets.length - 1; i >= 0; i--) {
      fwRockets[i].update();
      fwRockets[i].draw(fwCtx);
      if (fwRockets[i].dead) fwRockets.splice(i, 1);
    }
    for (let i = fwParticles.length - 1; i >= 0; i--) {
      fwParticles[i].update();
      fwParticles[i].draw(fwCtx);
      if (fwParticles[i].alpha <= 0) fwParticles.splice(i, 1);
    }

    if (fwRunning || fwRockets.length > 0 || fwParticles.length > 0) {
      fwRaf = requestAnimationFrame(fwTick);
    } else {
      fwCanvas.style.display = 'none';
    }
  }

  function celebrate(name) {
    fwCanvas      = document.getElementById('fireworks-canvas');
    fwCtx         = fwCanvas.getContext('2d');
    fwCanvas.width  = window.innerWidth;
    fwCanvas.height = window.innerHeight;
    fwCanvas.style.display = 'block';
    fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);

    document.getElementById('winner-name').textContent = name;
    document.getElementById('winner-overlay').style.display = 'flex';

    fwParticles.length = 0;
    fwRockets.length   = 0;
    fwRunning = true;

    // initial burst
    for (let i = 0; i < 6; i++) setTimeout(() => fwRockets.push(new FWRocket()), i * 120);

    // sustained launch
    fwLaunchId = setInterval(() => {
      fwRockets.push(new FWRocket());
      if (Math.random() > 0.45) fwRockets.push(new FWRocket());
    }, 380);

    // stop launching after 7s, let particles die out
    setTimeout(() => {
      fwRunning = false;
      clearInterval(fwLaunchId);
      fwLaunchId = null;
    }, 7000);

    cancelAnimationFrame(fwRaf);
    fwRaf = requestAnimationFrame(fwTick);
  }

  function stopCelebration() {
    fwRunning = false;
    clearInterval(fwLaunchId);
    fwLaunchId = null;
    cancelAnimationFrame(fwRaf);
    fwParticles.length = 0;
    fwRockets.length   = 0;
    if (fwCanvas) {
      fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
      fwCanvas.style.display = 'none';
    }
    document.getElementById('winner-overlay').style.display = 'none';
    document.getElementById('fade-overlay').style.opacity = '0';
  }

  /* ============================================================
     KEYBOARD & FULLSCREEN
  ============================================================ */
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
      e.preventDefault();
      if (document.getElementById('winner-overlay').style.display !== 'none') {
        stopCelebration();
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        return;
      }
      revealNext();
    } else if (e.code === "KeyR") {
      resetReveal();
    }
  });

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }
  document.addEventListener("fullscreenchange", () => {
    document.getElementById("btn-fullscreen").textContent =
      document.fullscreenElement ? "✕ Выйти" : "⛶";
  });

  loadResults();
</script>
</body>
</html>
